app.frontend-url=http://localhost:5173

# ?? Servidor ??????????????????????????????????????????
server.port=8080

# ?? Banco de dados ????????????????????????????????????
# URL de conexão com o PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/print3d

# Usuário e senha do seu PostgreSQL local
spring.datasource.username=
spring.datasource.password=

# Driver JDBC do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ?? JPA / Hibernate ???????????????????????????????????
# update = cria/altera tabelas automaticamente sem apagar dados
# (em produção troca por validate ou flyway)
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL gerado pelo JPA no console ? ótimo pra debugar
spring.jpa.show-sql=true

# Dialeto específico do PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ?? JWT ???????????????????????????????????????????????
# Chave secreta usada pra assinar os tokens (mínimo 256 bits)
# Em produção vai numa variável de ambiente, NUNCA no código
jwt.secret=
jwt.expiration=86400000

# ?? Cloudinary ????????????????????????????????????????
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
resend.from=Print3D <>


# ?? Upload ????????????????????????????????????????????
# Tamanho máximo de arquivo aceito (fotos dos produtos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
